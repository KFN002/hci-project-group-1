[project]
name = "document-reviewer"
version = "0.1.0"
description = "document reviewer webapp"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "gunicorn>=26.2.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
dr = "document_reviewer.main:main"

[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
